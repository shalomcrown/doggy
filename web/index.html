<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doggy</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    input[type="range"] { width: 12rem; }
    #status { min-height: 1.2em; }
    #errors { color: #8b0000; white-space: pre-wrap; }
    #imu { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Doggy</h1>
  <p id="errors" role="alert"></p>
  <button type="button" id="home">Home</button>
  <p id="status" role="status"></p>
  <section id="imu" aria-labelledby="imu-heading">
    <h2 id="imu-heading">IMU</h2>
    <p id="imu-ok">IMU: unknown</p>
    <table>
      <caption>IMU readings</caption>
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col">X</th>
          <th scope="col">Y</th>
          <th scope="col">Z</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Accel (g)</th>
          <td id="imu-ax">—</td>
          <td id="imu-ay">—</td>
          <td id="imu-az">—</td>
        </tr>
        <tr>
          <th scope="row">Gyro (°/s)</th>
          <td id="imu-gx">—</td>
          <td id="imu-gy">—</td>
          <td id="imu-gz">—</td>
        </tr>
      </tbody>
    </table>
    <p>Temperature: <span id="imu-temp">—</span> °C</p>
  </section>
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">PWM</th>
        <th scope="col">Angle</th>
        <th scope="col">Control</th>
      </tr>
    </thead>
    <tbody id="servos"></tbody>
  </table>
  <script>
    const IDLE_MS = 100;
    const POLL_MS = 200;

    const statusEl = document.getElementById("status");
    const errorsEl = document.getElementById("errors");
    const bodyEl = document.getElementById("servos");
    const imuOkEl = document.getElementById("imu-ok");
    const imuTempEl = document.getElementById("imu-temp");
    const imuAxEl = document.getElementById("imu-ax");
    const imuAyEl = document.getElementById("imu-ay");
    const imuAzEl = document.getElementById("imu-az");
    const imuGxEl = document.getElementById("imu-gx");
    const imuGyEl = document.getElementById("imu-gy");
    const imuGzEl = document.getElementById("imu-gz");
    let statusPollBusy = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function formatNum(n) {
      if (typeof n !== "number" || Number.isFinite(n) === false) {
        return "—";
      }

      return n.toFixed(3);
    }

    function applyErrors(errors) {
      if (errors === undefined || errors.length === 0) {
        errorsEl.textContent = "";
        return;
      }

      errorsEl.textContent = errors.map((err) => err.message || err.code).join("\n");
    }

    function applyImu(imu) {
      if (imu === undefined || imu === null) {
        imuOkEl.textContent = "IMU: unavailable";
        return;
      }

      if (imu.ok) {
        imuOkEl.textContent = "IMU: ok";
      } else {
        imuOkEl.textContent = "IMU: not connected";
      }

      imuTempEl.textContent = formatNum(imu.temperature_c);
      imuAxEl.textContent = formatNum(imu.accel && imu.accel.x);
      imuAyEl.textContent = formatNum(imu.accel && imu.accel.y);
      imuAzEl.textContent = formatNum(imu.accel && imu.accel.z);
      imuGxEl.textContent = formatNum(imu.gyro && imu.gyro.x);
      imuGyEl.textContent = formatNum(imu.gyro && imu.gyro.y);
      imuGzEl.textContent = formatNum(imu.gyro && imu.gyro.z);
    }

    async function loadDogStatus() {
      if (statusPollBusy) {
        return;
      }

      statusPollBusy = true;
      try {
        const res = await fetch("/api/status");
        if (res.ok === false) {
          applyErrors([{ message: "Failed to load status" }]);
          return;
        }

        const data = await res.json();
        applyErrors(data.errors || []);
        applyImu(data.imu);
      } catch (err) {
        applyErrors([{ message: "Failed to load status" }]);
      } finally {
        statusPollBusy = false;
      }
    }

    function applyItems(items) {
      bodyEl.replaceChildren();
      for (const servo of items) {
        const tr = document.createElement("tr");

        const nameTd = document.createElement("td");
        nameTd.textContent = servo.name;

        const pwmTd = document.createElement("td");
        pwmTd.textContent = String(servo.pwm);

        const angleTd = document.createElement("td");
        angleTd.textContent = String(servo.angle);

        const controlTd = document.createElement("td");
        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = "0";
        slider.max = "180";
        slider.step = "1";
        slider.value = String(servo.angle);
        slider.id = "servo-" + servo.id;
        slider.setAttribute("aria-label", servo.name + " angle");
        let idleTimer = null;
        slider.addEventListener("input", () => {
          angleTd.textContent = slider.value;
          if (idleTimer !== null) {
            clearTimeout(idleTimer);
          }
          idleTimer = setTimeout(() => {
            sendAngle(servo.id, Number(slider.value));
          }, IDLE_MS);
        });
        controlTd.appendChild(slider);

        tr.append(nameTd, pwmTd, angleTd, controlTd);
        bodyEl.appendChild(tr);
      }
    }

    async function loadServos() {
      const res = await fetch("/api/servos");
      if (res.ok === false) {
        setStatus("Failed to load servos");
        return;
      }
      const data = await res.json();
      applyItems(data.items || []);
    }

    async function sendAngle(id, angle) {
      const res = await fetch("/api/servos/" + id, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ angle: angle })
      });
      if (res.status === 409) {
        setStatus("Busy — try again");
        return;
      }
      if (res.ok === false) {
        setStatus("Move failed");
        return;
      }
      setStatus("");
      const data = await res.json();
      applyItems(data.items || []);
    }

    document.getElementById("home").addEventListener("click", async () => {
      const res = await fetch("/api/home", { method: "POST" });
      if (res.status === 409) {
        setStatus("Busy — try again");
        return;
      }
      if (res.ok === false) {
        setStatus("Homing failed");
        return;
      }
      setStatus("Homed");
      const data = await res.json();
      applyItems(data.items || []);
    });

    loadServos();
    loadDogStatus();
    setInterval(loadDogStatus, POLL_MS);
  </script>
</body>
</html>
