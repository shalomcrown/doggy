[platformio]
default_envs = twatch-s3, waveshare-c6
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; pioarduino esptool 5.4.0 crashes during write_flash:
; AttributeError: EsptoolLogger has no attribute _get_progress_print_file
platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.3.1/esptool.zip
extra_scripts = pre:scripts/ensure_esptool.py
lib_deps =
    lvgl/lvgl @ 9.3.0
build_flags =
    -D LV_CONF_SKIP
    -D LV_USE_LOG=0
    -D LV_USE_ROLLER=1
    -D LV_USE_TILEVIEW=1
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -D CORE_DEBUG_LEVEL=1

[env:twatch-s3]
board = lilygo-t-watch-s3
build_flags =
    ${env.build_flags}
    -D DOGGY_WATCH_TWATCH_S3
    -D ARDUINO_T_WATCH_S3
    -D ARDUINO_LILYGO_LORA_SX1262
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_USE_STDLIB_MALLOC=255
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
lib_deps =
    ${env.lib_deps}
    xinyuan-lilygo/LilyGoLib @ 0.2.1
    mikalhart/TinyGPSPlus @ 1.0.3

[env:waveshare-c6]
board = esp32-c6-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
build_flags =
    ${env.build_flags}
    -D DOGGY_WATCH_WAVESHARE_C6
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D XPOWERS_CHIP_AXP2101
lib_deps =
    ${env.lib_deps}
    https://github.com/moononournation/Arduino_GFX.git#v1.6.8
    lewisxhe/XPowersLib @ 0.2.6
    lewisxhe/SensorLib @ 0.3.1
